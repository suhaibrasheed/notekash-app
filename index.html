    <!-- SHELL-FIRST LOADER (CRITICAL PATH) -->
    <div id="nk-shell-loader"
        style="position:fixed;inset:0;z-index:9999999;display:flex;flex-direction:column;align-items:center;justify-content:center;font-family:'Montserrat',sans-serif;transition:opacity 0.8s cubic-bezier(0.4,0,0.2,1);will-change:opacity;overflow:hidden;background:#181411;">
        

        <div class="nk-loader-card">
            <div class="nk-loader-book">
                <div class="nk-loader-pages"></div>
            </div>
            <h1>NoteKash</h1>
            <div class="nk-loader-sub">Turn Notes into Knowledge</div>
            <div class="nk-loader-divider"></div>
            <div class="nk-loader-status">
                <span class="nk-loader-status-label">Loading your Second Brain</span>
                <div class="nk-travel-dots">
                    <span></span><span></span><span></span><span></span><span></span>
                </div>
            </div>
        </div>
    </div>
    <script>
        (function () {
            try {
                var o = document.getElementById('nk-shell-loader');
                if (!o) return;

                var showTime = Date.now();
                var dismissed = false;

                // Dismiss helper - silky GPU fade-out
                var dismiss = function (waitMs) {
                    if (dismissed) return;
                    dismissed = true;
                    setTimeout(function () {
                        requestAnimationFrame(function () {
                            o.style.opacity = '0';
                            o.style.pointerEvents = 'none';
                            setTimeout(function () {
                                if (o && o.parentNode) o.remove();
                            }, 850);
                        });
                    }, waitMs || 0);
                };

                // Safety cap: never stay longer than 5.5s
                var safetyTimer = setTimeout(function () { dismiss(0); }, 5500);

                document.addEventListener('nk:ready', function (e) {
                    clearTimeout(safetyTimer);
                    var isSkip = e.detail && e.detail.skip;
                    var elapsed = Date.now() - showTime;
                    var targetWait = isSkip ? 2200 : 2600;
                    dismiss(Math.max(0, targetWait - elapsed));
                }, { once: true });

            } catch (e) {
                console.error('Loader error', e);
                var el = document.getElementById('nk-shell-loader');
                if (el) el.style.display = 'none';
            }
        })();
    </script>

    <script id="pomodoro-worker-script" type="text/js-worker">
        let timerId = null;
        let timeLeft = 0;

        self.onmessage = function(e) {
            const { command, newTimeLeft } = e.data;

            if (command === 'start') {
                if (timerId) clearInterval(timerId);
                timeLeft = newTimeLeft;
                timerId = setInterval(() => {
                    timeLeft--;
                    self.postMessage({ type: 'tick', timeLeft: timeLeft });
                    if (timeLeft <= 0) {
                        clearInterval(timerId);
                        timerId = null;
                    }
                }, 1000);
            } else if (command === 'pause') {
                if (timerId) {
                    clearInterval(timerId);
                    timerId = null;
                }
            } else if (command === 'stop') {
                if (timerId) {
                    clearInterval(timerId);
                    timerId = null;
                }
                timeLeft = 0;
            }
        };
    </script>

    <script id="transcription-worker-script" type="text/js-worker">
        // **THE FIX**: This now uses the modern ES module import.
        // This is compatible with how the worker is created in runTranscription.
        // **OFFLINE FIX**
        let transcriber = null;
        let pipeline = null;

        self.addEventListener('message', async (event) => {
            const { audioData, modelName, playerId } = event.data;

            if (!pipeline) {
                try {
                    const module = await import('https://cdn.jsdelivr.net/npm/@xenova/transformers@2.17.1');
                    pipeline = module.pipeline;
                } catch (e) {
                     self.postMessage({ status: 'error', data: 'Offline: AI disabled.', playerId: playerId });
                     return;
                }
            }

            if (!transcriber) {
                try {
                    transcriber = await pipeline('automatic-speech-recognition', modelName);
                } catch (e) {
                    console.error("Failed to load transcription pipeline in worker", e);
                    self.postMessage({ status: 'error', data: 'Failed to load AI model.', playerId: playerId });
                    return;
                }
            }

             try {
                // THE FIX: Adding a stride creates overlapping audio chunks, which is crucial 
                // for maintaining context and preventing repetition in longer audio files.
                const output = await transcriber(audioData, {
                    chunk_length_s: 30,
                    stride_length_s: 5
                });
                self.postMessage({ status: 'complete', text: output.text, playerId: playerId });
            } catch (e) {
                console.error("Transcription failed in worker", e);
                self.postMessage({ status: 'error', data: 'Transcription failed.', playerId: playerId });
            }
        });
    </script>

            </button>
            <button onclick="document.getElementById('global-search-btn').click(); toggleFloatingMenu();" title="Global Search">
                <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <circle cx="11" cy="11" r="8"></circle>
                    <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
                </svg>
                Search
            </button>
            <button onclick="App.events.createNewArticle(); toggleFloatingMenu();" title="New Note">
                <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                    <line x1="12" y1="5" x2="12" y2="19"></line>
                    <line x1="5" y1="12" x2="19" y2="12"></line>
                </svg>
                New Note
            </button>
        </div>
        <button class="floating-nav-trigger" onclick="toggleFloatingMenu()" aria-label="Toggle Navigation Menu">
            <svg class="menu-icon" xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                <circle cx="12" cy="12" r="10"></circle>
                <polygon points="16.24 7.76 14.12 14.12 7.76 16.24 9.88 9.88 16.24 7.76"></polygon>
            </svg>
            <svg class="close-icon" xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" style="display: none;">
                <line x1="18" y1="6" x2="6" y2="18"></line>
                <line x1="6" y1="6" x2="18" y2="18"></line>
            </svg>
        </button>
    </div>

    <script>
        window.toggleFloatingMenu = function() {
            const container = document.querySelector('.floating-nav-container');
            if (!container) return;
            container.classList.toggle('open');
            const menuIcon = container.querySelector('.menu-icon');
            const closeIcon = container.querySelector('.close-icon');
            if (container.classList.contains('open')) {
                menuIcon.style.display = 'none';
                closeIcon.style.display = 'block';
            } else {
                menuIcon.style.display = 'block';
                closeIcon.style.display = 'none';
            }
        };
    </script>

    <script type="module" src="js/main.js"></script>
</body>

</html>
